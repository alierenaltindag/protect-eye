name: 🐛 Bug Report
description: Report a reproducible problem or unexpected behavior in ProtectEye
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us investigate and fix the problem.
  - type: input
    id: os
    attributes:
      label: Operating System & Desktop Environment
      description: What OS and desktop environment are you running?
      placeholder: "e.g., CachyOS Linux (GNOME 46 / Wayland) or Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Launch ProtectEye
        2. Wait for short break or trigger via tray menu
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Additional Context
      description: Run `protecteye` from terminal and paste output here if available.
